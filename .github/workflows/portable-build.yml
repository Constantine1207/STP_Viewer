name: Portable desktop build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_macos:
        description: Also build the macOS package
        type: boolean
        default: false

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            .deps
            .tools
          key: native-windows-2022-x64-${{ hashFiles('scripts/dependencies.lock.json', 'scripts/bootstrap*') }}
      - name: Build pinned dependencies
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1 -Jobs 4
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            .deps
            .tools
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      # Hosted Windows runners expose only Microsoft's OpenGL 1.1 renderer.
      # Install Mesa on the disposable test host; do not add it to the package.
      - name: Install software OpenGL for packaged runtime tests
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3
        with:
          version: '26.0.3'
          build-type: release-msvc
          deployment-choice: '1'
      - name: Build, test and package with machine-readable evidence
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
          STP_CI_MESA_VERSION: '26.0.3'
        run: ./scripts/build-windows.ps1 -Jobs 4 -SkipBootstrap -SkipGuiTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STPViewer-1.0.0-windows-x64
          path: |
            dist/*.exe*
            dist/*.zip*
            dist/*-bundle-validation.json
            dist/windows-build-report.json
            dist/validation
          if-no-files-found: error

  macos-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.build_macos
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .deps
            .tools
          key: native-macos-arm64-${{ hashFiles('scripts/dependencies.lock.json', 'scripts/bootstrap*') }}
      - name: Build pinned dependencies
        run: bash scripts/bootstrap-macos.sh --jobs 3
      - name: Configure and build
        run: |
          export PATH="$PWD/.tools/venv/bin:$PATH"
          cmake -C .deps/paths.cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DSTP_BUILD_TESTS=ON
          cmake --build build --target STPViewer stp_core_tests stp_measurement_tests stp_pmi_tests stp_job_queue_tests stp_placement_tests stp_transform_panel_tests --parallel 3
          ctest --test-dir build --output-on-failure
      - name: Create portable ZIP
        run: bash scripts/package-macos.sh build/STPViewer.app
      - uses: actions/upload-artifact@v4
        with:
          name: STPViewer-1.0.0-macos-arm64
          path: |
            dist/*.zip*
            dist/*-bundle-validation.json
            dist/validation
          if-no-files-found: error
